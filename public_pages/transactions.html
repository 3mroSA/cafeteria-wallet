<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wallet | ClassCash</title>
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
 <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="styles/home.css"/>
  <link rel="stylesheet" href="styles/transactions.css"/>
  <script defer src="scripts/utils.js"></script>
  <script defer src="scripts/transactions.js"></script>

</head>
<body class="bg-gradient">

  <div class="loader"><div class="innerloader"></div></div>

<header>
  <div id="maindiv">
    <div id="leftdiv">
      <h1>ClassCash</h1>
    </div>

    <input type="checkbox" id="sidebar-checkbox">
    <label for="sidebar-checkbox" class="overlay"></label>

    <label for="sidebar-checkbox" id="open-sidebar">
      <span class="material-symbols-outlined">menu</span>
    </label>

    <div class="links">
      <label for="sidebar-checkbox" id="close-sidebar">✖</label>
      <a href="/home">Home</a>
      <a href="/wallet">Wallet</a>
      <a href="/settings">Settings</a>
      <a href="/logout">Logout</a>
    </div>
  </div>
</header>

<main>
  <div class="container bg-white wallet-header">
    <h2 id="student-name">Card</h2>
    <div class="profile-icon">👤</div>
  </div>

<button id="back-button" onclick="back()">Back</button>
<p id="page"><input type="number" id="currentPage" >/<span id="totalPages"></span> </p>
<button id="next-button" class="btn-primary" onclick="next()">Next</button>

  <div id="wallet-cards-container">  
    <div class="wallet-card">
        <div class="transactions-list">
</div>
 </div>
</main>
</body>
</html>

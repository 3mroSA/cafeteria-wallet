<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signup | ClassCash </title>


  <script defer src="scripts/utils.js"></script>
  <script defer src="scripts/s.js"></script>



  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css"/>
</head>
<body class="bg-gradient">

  <div class="loader"><div class="innerloader"></div></div>

  <div class="container bg-white shadow-lg">
    <form class="form">
      <h2 class="text-dark">Welcome</h2>
      <p class="text-muted">Create your ClassCash account</p>

      <input class="input-field" id="name" type="text" name="name" placeholder="Name" required />
      <input class="input-field" id="username" type="text" name="username" placeholder="Username" required />
      <input class="input-field" id="email" type="email"   name="email" placeholder="Email" required />
      <input class="input-field" id="phone" type="number" name="phone" placeholder="Phone Number" required />
      <input class="input-field" id="password" type="password" name="password" placeholder="Password" required />

      <button class="btn-primary" type="submit">Create</button>

      <div class="footer">
        <p class="text-muted"  id="responsebx"></p>

        <a href="/login" class="link-primary">Already have an account?</a>
                <br>
                <br>
        <p  class="link-primary">By creating an account you automatically agree to our <a href="tos.html" style="text-decoration: underline;" class="link-primary">Terms of Service</a>.</p>
      </div>
    </form>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | ClassCash </title>

  <script defer src="scripts/utils.js"></script>
  <script defer src="scripts/l.js"></script>


  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css"/>
</head>
<body class="bg-gradient">

<div class="loader"><div class="innerloader"></div></div>

    
  <div class="container bg-white shadow-lg">
    <form class="form">
      <h2 class="text-dark">Welcome Back</h2>
      <p class="text-muted">Login to your ClassCash account</p>

      <input id="email" class="input-field" type="email" placeholder="Email" required />
      <input id="password" class="input-field" type="password" placeholder="Password" required />

      <button class="btn-primary" type="submit">Login</button>

      <div class="footer">
        <p class="text-muted"  id="responsebx"></p>
        <a href="#" class="link-primary">Forgot Password?</a>
        <span style="margin: 5px;">•</span>
        <a href="/" class="link-primary">Sign Up</a>
      </div>
    </form>
  </div>
</body>
</html>
